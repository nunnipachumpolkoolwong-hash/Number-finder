<script>
const rg=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const F=n=>n<2?1:n*F(n-1);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fr=(a,b)=>{const g=gcd(a,b);return b/g===1?a/g:(a/g)+'/'+(b/g)};
function tbl(corner,cols,rows,cell,cl=c=>c,rl=r=>r){
 return '<div class="sc"><table><tr><th>'+corner+'</th>'+cols.map(c=>'<th>'+cl(c)+'</th>').join('')+'</tr>'+
 rows.map(r=>'<tr><th>'+rl(r)+'</th>'+cols.map(c=>{const v=cell(r,c);return '<td'+(v&&v.d?' class="d"':'')+'>'+(v===null?'':(v&&v.d?v.v:v))+'</td>'}).join('')+'</tr>').join('')+'</table></div>'}
function baseChips(a,b){return '<div class="chips">'+rg(a,b).map(x=>'<button class="chip'+(S.base===x?' on':'')+'" data-b="'+x+'">ฐาน '+x+'</button>').join('')+'</div>'}
const sigF=[i=>i,i=>2*i,i=>i*i];
function sig(k){const f=sigF[k];return '<div class="rule">Σ(i=M→N) '+['i','2i','i²'][k]+' &nbsp;· แถว = M (ค่าเริ่มต้น), คอลัมน์ = N (ค่าสุดท้าย)</div>'+
 tbl('M＼N',rg(1,15),rg(1,9),(m,n)=>{if(n<m)return null;let s=0;for(let i=m;i<=n;i++)s+=f(i);return n===m?{d:1,v:s}:s})}
const C={
fact:{title:'แฟคทอเรียล!!!',col:'#2fa866',dc:['🌿','🍀','🥬'],secs:[
 ['ตารางแฟค',()=>'<div class="grid">'+rg(0,10).map(n=>'<div>'+n+'! = '+F(n)+'</div>').join('')+'</div><div class="rule">n! = n×(n−1)×…×1 และ 0! = 1</div>'],
 ['แฟคหารเลข',()=>'<div class="rule">n! ÷ k  (ถ้าลงตัวขึ้นเป็นเลขเต็ม ไม่ลงตัวเป็นเศษส่วน) · n! ÷ n = (n−1)!</div>'+tbl('n!',[2,3,4,5,6,'n'],rg(2,10),(n,k)=>{const d=k==='n'?n:k;const v=fr(F(n),d);return k==='n'?{d:1,v}:v},k=>'÷ '+k,n=>n+'! = '+F(n))],
 ['แฟคหารแฟค',()=>'<div class="rule">n! ÷ m! = (m+1)×(m+2)×…×n เมื่อ n ≥ m</div>'+tbl('n＼m',rg(1,10),rg(1,10),(n,m)=>n<m?null:(n===m?{d:1,v:1}:F(n)/F(m)),m=>m+'!',n=>n+'!')]]},
sigma:{title:'ซิกม่า Σ',col:'#d6366f',dc:['🎀','💖','✨'],secs:[['Sum (i)',()=>sig(0)],['Sum (i+i) หรือ 2i',()=>sig(1)],['Sum (i×i) หรือ i²',()=>sig(2)]]},
root:{title:'ราก √',col:'#2f7fc0',dc:['🫧','💎','🌊'],secs:[
 ['รากที่สอง',()=>'<div class="rule">√x = k เมื่อ k×k = x</div>'+tbl('√x',['แยกตัวประกอบ','ค่าที่ได้','ยกกำลังสอง'],rg(1,25),(x,c)=>{const k=x;return c==='ค่าที่ได้'?{d:1,v:k}:c==='ยกกำลังสอง'?k+'² = '+k*k:'√('+k+'×'+k+')'},c=>c,k=>'√'+k*k)],
 ['รากที่สาม',()=>'<div class="rule">∛x = k เมื่อ k×k×k = x</div>'+tbl('∛x',['แยกตัวประกอบ','ค่าที่ได้'],rg(1,10),(k,c)=>c==='ค่าที่ได้'?{d:1,v:k}:k+'×'+k+'×'+k+' = '+k**3,c=>c,k=>'∛'+k**3)]]},
pow:{title:'ยกกำลัง ^',col:'#f28a1e',dc:['🔥','⭐','🧡'],secs:[
 ['ยกกำลังคูณ',()=>{const b=S.base,mx=b===2?8:b===3?6:b===4?5:4;return baseChips(2,9)+tbl('',rg(1,12),rg(1,mx),(e,k)=>b**e*k,k=>'×'+k,e=>b+'<sup>'+e+'</sup>')}],
 ['ตารางเลขยกกำลัง',()=>tbl('ฐาน＼เลขชี้กำลัง',rg(2,10),rg(2,10),(b,e)=>b**e,e=>e,b=>b)],
 ['กำลังสอง 13–32',()=>'<div class="grid">'+rg(13,32).map(n=>'<div>'+n+'² = '+n*n+'</div>').join('')+'</div>'],
 ['ยกกำลังหาร',()=>{const b=S.base;return '<div class="rule">a<sup>n</sup> ÷ a<sup>k</sup> = a<sup>n−k</sup> · a<sup>0</sup> = 1 · a<sup>−n</sup> = 1/a<sup>n</sup></div>'+baseChips(2,9)+tbl(b+'<sup>n</sup>＼÷'+b+'<sup>k</sup>',rg(1,10),rg(1,10),(n,k)=>n<k?null:(n===k?{d:1,v:1}:b**(n-k)),k=>b+'<sup>'+k+'</sup>',n=>b+'<sup>'+n+'</sup> = '+b**n)}]]}};
let S={sec:0,base:2};
function renderNote(){
 const c=C[cur];$('note').style.boxShadow='0 0 0 3px '+c.col+', 0 8px 0 3px '+c.col+'55';
 $('note').innerHTML='<div class="tape a" style="--c:'+c.col+'"></div><div class="tape b" style="--c:'+c.col+'"></div><span class="fl f1">'+c.dc[2]+'</span><span class="fl f2">'+c.dc[0]+'</span><div class="hd" style="--c:'+c.col+'"><span>'+c.dc[0]+'</span><h2>'+c.title+'</h2><span>'+c.dc[1]+'</span></div>'+
 '<div style="--c:'+c.col+'"><div class="chips">'+c.secs.map((s,i)=>'<button class="chip'+(S.sec===i?' on':'')+'" data-s="'+i+'">'+s[0]+'</button>').join('')+'</div>'+c.secs[S.sec][1]()+'</div>';
}
function show(t){
 cur=(cur===t)?null:t;S={sec:0,base:2};
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
 $('welcome').hidden=!!cur;$('note').hidden=!cur;if(cur)renderNote();
}
$('note').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
 if(b.dataset.s!==undefined){S.sec=+b.dataset.s}else S.base=+b.dataset.b;renderNote()};
</script>

<script>
(function(){
const rnd=n=>Math.floor(Math.random()*n);
let sol=null,mode=4,root=[],act=root,owner=null,digits=[],target=0,score=0,locked=false;
// ---- ตัวคำนวณ (รองรับ + − × ÷ ^ ( ) √ ! Σ i) ----
function ev(ns,env){
 const t=[];
 for(let i=0;i<ns.length;i++){const x=ns[i];
  if(x.k==='d'){if(ns[i+1]&&ns[i+1].k==='d')throw 0;t.push({n:+x.v})}
  else if(x.k==='sig')t.push({sig:x});else t.push({o:x.v})}
 let p=0;const isO=v=>t[p]&&t[p].o===v;
 function ex(){let v=tm();while(isO('+')||isO('−')){const o=t[p++].o,r=tm();v=o==='+'?v+r:v-r}return v}
 function tm(){let v=un();while(isO('×')||isO('÷')){const o=t[p++].o,r=un();if(o==='÷'&&r===0)throw 0;v=o==='×'?v*r:v/r}return v}
 function un(){if(isO('−')){p++;return -un()}return pw()}
 function pw(){let b=po();if(isO('^')){p++;const e=un();if(!Number.isInteger(e)||e<-10||e>10)throw 0;b=b**e}return b}
 function po(){let v=pr();while(isO('!')){p++;if(!Number.isInteger(v)||v<0||v>10)throw 0;v=F(v);if(isO('!'))throw 0}return v}
 function pr(){const x=t[p++];if(!x)throw 0;
  if(x.n!==undefined)return x.n;
  if(x.sig){const a=ev(x.sig.f),b=ev(x.sig.to);if(!Number.isInteger(a)||!Number.isInteger(b)||a>b||b-a>999)throw 0;let s=0;for(let i=a;i<=b;i++)s+=ev(x.sig.b,{i});return s}
  if(x.o==='i'){if(!env||env.i===undefined)throw 0;return env.i}
  if(x.o==='('){const v=ex();if(!isO(')'))throw 0;p++;return v}
  if(x.o==='√'){const v=pr();if(v<0)throw 0;return Math.sqrt(v)}
  throw 0}
 const v=ex();if(p!==t.length)throw 0;return v}
// ---- สร้างโจทย์ ----
function gen(){
 const n=mode,lo=n===4?10:100,hi=n===4?99:999,ops=['+','−','×','×','÷','^'];
 for(let k=0;k<30000;k++){
  const d=Array.from({length:n},()=>1+rnd(9)),ns=[];
  d.forEach((x,i)=>{ns.push({k:'d',v:String(x)});if(i<n-1)ns.push({k:'o',v:ops[rnd(ops.length)]})});
  try{const v=ev(ns);if(Number.isInteger(v)&&v>=lo&&v<=hi)return{d,v,ns}}catch(e){}
 }
 return n===4?{d:[3,8,7,5],v:53}:{d:[2,3,4,5,6],v:123};
}
function col(a,o){a.forEach(x=>{if(x.k==='d')o.push(x.tile);else if(x.k==='sig'){col(x.f,o);col(x.to,o);col(x.b,o)}})}
const used=()=>{const o=[];col(root,o);return o};
const txt=a=>a.map(x=>x.v).join('');
const msg=t=>$('msg').textContent=t;
function draw(){
 const u=used();
 $('tiles').innerHTML=digits.map((d,i)=>'<button class="tile" data-i="'+i+'" '+(u.includes(i)?'disabled':'')+'>'+d+'</button>').join('');
 const sl=(a,i,n)=>'<span class="slot'+(act===a?' on':'')+'" data-i="'+i+'" data-n="'+n+'">'+(a.length?txt(a):'▢')+'</span>';
 $('expr').innerHTML=root.map((x,i)=>x.k==='sig'?'<span class="sg">'+sl(x.to,i,'to')+'<b>Σ</b><span>i='+sl(x.f,i,'f')+'</span></span>('+sl(x.b,i,'b')+')':x.v).join('');
 $('expr').classList.toggle('on',act===root);
 let v=null;try{v=ev(root);if(!isFinite(v))v=null}catch(e){}
 const jn=a=>a.some((x,i)=>x.k==='d'&&a[i+1]&&a[i+1].k==='d')||a.some(x=>x.k==='sig'&&(jn(x.f)||jn(x.to)||jn(x.b)));
 $('res').textContent=jn(root)?'ห้ามต่อเลขติดกัน':'= '+(v===null?'':Math.round(v*1e6)/1e6);
}
function clr(){root=[];act=root;owner=null;msg('');draw()}
function newQ(){const g=gen();digits=g.d;target=g.v;sol=g.ns||null;$('target').textContent=target;clr();time=60;locked=false}

// ---- ปุ่มคีย์ ----
const filled=s=>s.f.length||s.to.length||s.b.length;
function press(k){
 if(k==='⌫'){
  const last=root[root.length-1];
  if(act===root&&last&&last.k==='sig'&&filled(last)){
   // ไม่ลบ Σ ทั้งก้อน: เข้าไปลบทีละส่วนข้างในก่อน
   owner=last;act=last.b.length?last.b:last.to.length?last.to:last.f;
  }else if(act.length){
   act.pop();
   if(!act.length&&owner&&act!==root&&filled(owner))act=owner.b.length?owner.b:owner.to.length?owner.to:owner.f;
  }else if(owner&&act!==root&&!filled(owner)){root.splice(root.indexOf(owner),1);act=root;owner=null}
 }else if(k==='Σ'){if(act!==root)return;const n={k:'sig',f:[],to:[],b:[]};root.push(n);owner=n;act=n.f}
 else if(k==='i'){if(!owner||act!==owner.b)return;act.push({k:'o',v:'i'})}
 else act.push({k:'o',v:k});
 draw()}
$('keys').innerHTML='';$('keys').style.gridTemplateColumns='repeat(6,1fr)';
['+','−','×','÷','(',')','^','√','!','Σ','i','⌫','ล้าง'].forEach(k=>{
 const b=document.createElement('button');b.className='k'+('^√!Σi'.includes(k)?' p':'');b.textContent=k;
 if(k==='ล้าง'){b.style.gridColumn='span 6';b.onclick=clr}else b.onclick=()=>press(k);

$('go').onclick=()=>{

 else msg('ยังไม่ใช่ ลองใหม่นะ');
};
const bot=$('new').parentNode;
bot.style.gridTemplateColumns='repeat(3,1fr)';
bot.innerHTML='<button class="k" id="nq">สุ่มโจทย์ใหม่</button><button class="k" id="hp">วิธีทำ</button><button class="k" id="rs">รีเซ็ต</button>';
const hp=document.createElement('div');hp.className='help';hp.hidden=true;
hp.innerHTML='Σ: กด Σ แล้วแตะช่องเพื่อเลือกใส่ ค่าเริ่มของ i, ค่าสุดท้าย หรือสมการในวงเล็บ (ปุ่ม i ใช้ได้เฉพาะในวงเล็บ) และแตะที่เทปส่วนอื่นเพื่อกลับไปเขียนนอก Σ · √ ใส่หน้าเลขหรือวงเล็บ · ! ใช้กับ 0–10 (ห้าม !! ต้องเขียน (n!)!) · ^ ยกกำลัง (เลขชี้กำลังเป็นจำนวนเต็ม −10 ถึง 10 ทำก่อน × +) · ⌫ จะลบ Σ ทีละส่วนข้างใน และลบทั้งก้อนเมื่อว่างเปล่า';
bot.parentNode.insertBefore(hp,bot.nextSibling);
$('nq').onclick=newQ;function steps(ns){
 const t=[];for(let i=0;i<ns.length;i++){const x=ns[i];if(x.k==='d'){let s=x.v;while(ns[i+1]&&ns[i+1].k==='d')s+=ns[++i].v;t.push(+s)}else t.push(x.v)}
 const show=a=>a.join(' ');const out=[show(t)];
 const ap=(a,o,b)=>{const r=o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?a/b:a**b;return Math.round(r*1e6)/1e6};
 while(t.length>1){
  let i=-1;
  for(let j=t.length-2;j>=1;j-=2){if(t[j]==='^'){i=j;break}}
  if(i<0)i=t.findIndex((x,j)=>j%2===1&&(x==='×'||x==='÷'));
  if(i<0)i=1;
  t.splice(i-1,3,ap(t[i-1],t[i],t[i+1]));out.push(show(t));
 }
 return out}
function showSol(){
 let ov=document.getElementById('sol');if(ov)ov.remove();
 ov=document.createElement('div');ov.id='sol';
 const body=sol?steps(sol).map((s,i)=>'<div class="st">'+(i?'= ':'')+s+'</div>').join(''):'<div class="st">ข้อนี้ยังไม่มีเฉลยแบบแสดงขั้นตอน</div>';
 ov.innerHTML='<div class="solc"><div class="solh">วิธีคิดข้อนี้</div><div class="sols">ใช้เลข '+digits.join(' · ')+' ให้ได้ '+target+'</div>'+body+'<button class="solb" id="solx">เข้าใจแล้ว</button></div>';
 ov.onclick=e=>{if(e.target===ov||e.target.id==='solx')ov.remove()};
 document.body.appendChild(ov)}
$('hp').onclick=showSol;
$('rs').onclick=()=>{score=0;$('score').textContent='0 ข้อ';newQ()};
setInterval(()=>{if(time===0&&!locked){locked=true;msg('หมดเวลา! สุ่มโจทย์ใหม่ให้แล้ว');setTimeout(newQ,1500)}},300);
newQ();
})();
